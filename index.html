<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0b1020">
<title>Audio to Text</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

<header>
<div class="logo">🎙️</div>
<h1>Audio to Text</h1>
<p>Speak clearly, we'll do the rest</p>
</header>

<main>

<section class="card">

<div class="visualizer" id="visualizer">
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
</div>

<div class="text-box" id="textBox">
<span id="finalText" class="final-text">Tap the microphone to start transcribing...</span>
<span id="interimText" class="interim-text"></span>
</div>

<div class="status" id="status">READY</div>

</section>

<div class="controls">

<button id="micButton" class="mic-button" type="button" aria-label="Start recording">
<span class="mic">🎙️</span>
</button>

<button id="copyButton" class="small-button" type="button" title="Copy text" aria-label="Copy text">
📋
</button>

<button id="clearButton" class="small-button" type="button" title="Clear text" aria-label="Clear text">
🗑️
</button>

</div>

<div class="language-box">

<label for="language">Language</label>

<select id="language">
<option value="en-US">English (US)</option>
<option value="en-GB">English (UK)</option>
<option value="bn-BD">বাংলা (Bangladesh)</option>
<option value="hi-IN">हिन्दी</option>
<option value="ur-PK">اردو</option>
</select>

</div>

<div id="browserMessage" class="browser-message"></div>

</main>

<footer>
<div>© 2026 <strong>Irfan Ahmed</strong></div>
<small>Powered by Web Speech API</small>
</footer>

</div>

<script src="script.js"></script>

</body>
</html>
